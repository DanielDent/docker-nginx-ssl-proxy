services:
  app:
    image: nginx:stable
    expose:
      - "80"

  nginx-ssl-proxy:
    image: danieldent/nginx-ssl-proxy
    restart: always
    environment:
      UPSTREAM: app:80
      SERVERNAME: test.example.com
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt

volumes:
  letsencrypt:
